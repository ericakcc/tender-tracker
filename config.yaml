budget:
  min: 150000
  max: 3000000

procurement_types:
  - 勞務

ebuying_categories:
  - "226"

schedule:
  fetch_interval: "0 9,14 * * 1-5"

# LLM backend configuration
llm:
  backend: vllm                      # Options: "vllm" (local) or "claude" (API)
  model: Qwen/Qwen3-8B-Instruct      # Model name for vLLM, or claude-sonnet for Claude
  api_base: http://localhost:8000/v1 # vLLM server URL (ignored for Claude)
  api_key: EMPTY                     # API key (use EMPTY for local vLLM)
  max_retries: 3                     # Retries for structured output parsing
  temperature: 0.1                   # Sampling temperature (lower = deterministic)
  team_profile: |
    光聚晶電聯合（Star Fusion Group）核心技術能力：

    1. AI / ML / Deep Learning 模型開發
       - 大型語言模型 (LLM) 應用與微調
       - 生成式 AI 應用開發
       - 電腦視覺與影像辨識
       - 自然語言處理 (NLP)

    2. 全端軟體開發
       - Web 應用程式開發（前端 + 後端）
       - API 設計與實作
       - 雲端原生架構

    3. 資料工程與分析
       - 資料平台建置
       - 數據分析儀表板
       - ETL 管線開發

    4. 遊戲技術
       - 遊戲引擎技術（大宇資訊經驗）
       - 互動式 3D 應用
       - VR/AR 技術應用

    5. 資安（安瑞-KY）
       - 資訊安全解決方案
       - 資安稽核與顧問

    6. 支付系統（紅陽科技）
       - 電子支付整合
       - 金流系統開發
